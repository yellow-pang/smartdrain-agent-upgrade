name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartdrain-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose:
    name: Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COMPOSE_PROJECT_NAME: smartdrain-ci
      NGINX_HTTP_PORT: 127.0.0.1:8099
      SMARTDRAIN_YOLO_MODEL_PATH: /tmp/smartdrain-ci/best.pt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate local Compose inputs without a private env file
        run: |
          docker compose --env-file /dev/null config --quiet
          docker compose --env-file /dev/null -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - name: Validate digest selection and persistent service boundaries
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          images = {
              "SMARTDRAIN_BACKEND_IMAGE": "ghcr.io/yellow-pang/smartdrain-backend@sha256:" + "a" * 64,
              "SMARTDRAIN_AI_IMAGE": "ghcr.io/yellow-pang/smartdrain-ai@sha256:" + "b" * 64,
              "SMARTDRAIN_FRONTEND_IMAGE": "ghcr.io/yellow-pang/smartdrain-frontend@sha256:" + "c" * 64,
          }
          config = json.loads(subprocess.check_output(
              ["docker", "compose", "--env-file", "/dev/null", "--profile", "seed", "config", "--format", "json"],
              env={**os.environ, **images}, text=True,
          ))
          services = config["services"]
          for service in ("backend", "migrate", "seed"):
              assert services[service]["image"] == images["SMARTDRAIN_BACKEND_IMAGE"], service
          assert services["ai-service"]["image"] == images["SMARTDRAIN_AI_IMAGE"]
          assert services["frontend"]["image"] == images["SMARTDRAIN_FRONTEND_IMAGE"]
          for service in ("db", "backend", "ai-service", "frontend"):
              assert not services[service].get("ports"), service
          port = services["nginx"]["ports"][0]
          assert port["host_ip"] == "127.0.0.1" and str(port["published"]) == "8099"
          assert services["db"]["volumes"][0]["source"] == "postgres_data"
          assert config["volumes"]["postgres_data"]["name"] == "smartdrain-ci_postgres_data"
          for service, target in (
              ("ai-service", "/app/ai_service/model/best.pt"),
              ("nginx", "/etc/nginx/conf.d/default.conf"),
          ):
              mounts = [mount for mount in services[service]["volumes"] if mount["target"] == target]
              assert len(mounts) == 1 and mounts[0]["read_only"] is True, service
          print("Compose digest, volume, port and read-only mount checks passed.")
          PY

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      COMPOSE_FRONTEND_API_BASE_URL: ""
      COMPOSE_FRONTEND_KAKAO_MAP_APP_KEY: ci-placeholder-not-a-key
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  backend:
    name: Backend migration and API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      # These credentials belong only to the disposable CI service below.
      DATABASE_URL: postgresql+psycopg://smartdrain_ci:ci_only@127.0.0.1:5432/smartdrain_ci
      AI_SERVER_ENABLED: "false"
      ANALYSIS_SCHEDULER_ENABLED: "false"
      DEMO_SIMULATOR_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartdrain_ci
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: smartdrain_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartdrain_ci -d smartdrain_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - name: Verify the applied head and empty database through the running API
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine

          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          assert len(heads) == 1, f"Expected one Alembic head, got {heads}"
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              applied = MigrationContext.configure(connection).get_current_heads()
          engine.dispose()
          assert tuple(heads) == applied, f"Migration head mismatch: {heads} != {applied}"

          log_path = Path(os.environ["RUNNER_TEMP"]) / "smartdrain-backend-ci.log"
          with log_path.open("w") as log:
              server = subprocess.Popen(
                  [sys.executable, "-m", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"],
                  stdout=log, stderr=subprocess.STDOUT,
              )
              try:
                  deadline = time.monotonic() + 30
                  while True:
                      if server.poll() is not None:
                          raise RuntimeError(f"Backend exited with code {server.returncode}")
                      try:
                          with urlopen("http://127.0.0.1:8000/api/dashboard/summary", timeout=2) as response:
                              assert response.status == 200
                              payload = json.load(response)
                          break
                      except (URLError, TimeoutError):
                          if time.monotonic() >= deadline:
                              raise RuntimeError("Backend dashboard did not become ready within 30 seconds")
                          time.sleep(0.5)
                  assert payload["success"] is True and payload["error"] is None, payload
                  assert payload["data"] == {
                      "totalCount": 0, "goodCount": 0, "cautionCount": 0,
                      "dangerCount": 0, "unknownCount": 0, "latestUpdatedAt": None,
                  }, payload
                  print("Single Alembic head and empty-database dashboard contract passed.")
              except Exception:
                  log.flush()
                  print(log_path.read_text(), file=sys.stderr)
                  raise
              finally:
                  server.terminate()
                  try:
                      server.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      server.kill()
                      server.wait()
          PY

  ai:
    name: AI contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai_service/requirements.txt
      - name: Install dependencies for tests that mock model inference
        run: python -m pip install -c ai_service/requirements.txt pytest fastapi python-dotenv python-multipart
      - run: python -m pytest -c ai_service/pytest.ini ai_service

  ci:
    name: CI gate
    if: ${{ always() }}
    needs: [compose, frontend, backend, ai]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COMPOSE_RESULT: ${{ needs.compose.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      AI_RESULT: ${{ needs.ai.result }}
    steps:
      - name: Require every check to succeed
        run: |
          test "$COMPOSE_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$AI_RESULT" = success
